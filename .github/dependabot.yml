version: 2

updates:
  # Workflows pin actions by commit SHA; Dependabot keeps the SHAs current
  # and opens a pull request when one is outdated.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: pip
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docs
