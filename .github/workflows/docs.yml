name: Documentation

# Fast checks on the documentation set. They run on every push and pull
# request, because they take under a minute and catch the failure modes that
# are easiest to introduce and hardest to notice by eye:
#
#   - a file in docs/en/ whose body is still Chinese
#   - the English and Chinese halves of a document drifting apart
#   - a relative link or anchor that no longer resolves
#   - a complete example that no longer compiles
#
# The same scripts run locally through tools/run_all_checks.sh, so a green
# local run means a green CI run.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch the tinyshell submodule
        # The pinned submodule commit is not on the submodule's remote yet, so
        # this must not fail the run. The link checker reports the links into
        # an unpopulated submodule separately.
        continue-on-error: true
        run: git submodule update --init --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install the C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake
          # One example needs a C++26 library header (<inplace_vector>), which
          # the runner's default compiler does not ship. Use a newer one when
          # it is available; the checker skips what the toolchain cannot build.
          if apt-cache show g++-14 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends g++-14
            echo "CXX=g++-14" >> "$GITHUB_ENV"
            echo "CC=gcc-14" >> "$GITHUB_ENV"
          fi

      - name: Language and bilingual parity
        run: python3 tools/check_docs.py

      - name: Relative links
        run: python3 tools/check_links.py

      - name: Examples compile and run
        run: python3 tools/check_doc_examples.py

      - name: Standalone examples compile and run
        run: python3 tools/check_examples.py --run

      - name: Statistics agree with the repository
        run: python3 tools/check_stats.py

      - name: Project READMEs agree with their twin and their build
        run: python3 tools/check_project_readmes.py

      - name: The two roadmap indexes agree
        run: python3 tools/check_overview_parity.py
