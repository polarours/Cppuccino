name: Build

# Configure, build and test every project in the roadmap.
#
# The projects are independent of each other, so the work is split over a
# matrix of shards. The shards are balanced by project count, because the
# stages are very uneven: 02-intermediate holds seven projects while most
# stages hold three or four.
#
# Each shard reports which stages it covered, so a failure still points at
# the stage that broke.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover stages
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Plan the shards
        id: plan
        run: |
          shards=$(python3 tools/plan_ci_shards.py --shards 10)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  build:
    name: shard ${{ matrix.shard }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.discover.outputs.shards) }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake

      - name: Configure, build and test
        run: |
          set -euo pipefail
          for stage in ${{ join(matrix.shard.stages, ' ') }}; do
            echo "::group::$stage"
            python3 tools/build_all_projects.py --stage "$stage" --jobs 2
            echo "::endgroup::"
          done

      - name: Report
        if: always()
        run: |
          echo "shard ${{ matrix.shard.id }} covered ${{ matrix.shard.stages }}"

  demos:
    name: demos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-recommends g++ cmake

      - name: Run every demo
        # A demo that crashes on the way in is a demo nobody can use, and
        # two of them did nothing at all: they printed that the server had
        # started and never started it.
        run: python3 tools/check_demos.py --jobs 4

  sanitize:
    name: sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch the tinyshell submodule
        # The pinned submodule commit is not on the submodule's remote yet, so
        # this must not fail the run. The scan skips tinyshell when it is not
        # checked out.
        continue-on-error: true
        run: git submodule update --init --recursive

      - name: Install the C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-recommends g++ cmake
          # Two examples need a C++26 library header (<inplace_vector>), which
          # the runner's default compiler does not ship. Use a newer one when
          # it is available; the checker skips what the toolchain cannot build.
          if apt-cache show g++-14 >/dev/null 2>&1; then
            sudo apt-get install -y --no-recommends g++-14
            echo "CXX=g++-14" >> "$GITHUB_ENV"
            echo "CC=gcc-14" >> "$GITHUB_ENV"
          fi

      - name: Run every test under the sanitizers
        # A test that passes can still read freed memory or do something the
        # standard leaves undefined. The sanitizers turn those into failures.
        run: python3 tools/run_sanitizers.py --jobs 4

      - name: Run the examples under the sanitizers
        # The examples are teaching material, so a leak in one teaches a leak.
        run: python3 tools/check_examples.py --sanitize --jobs 4

      - name: Run the document examples under the sanitizers
        run: python3 tools/check_doc_examples.py --sanitize

      - name: Run the examples under the thread sanitizer
        # Two threads touching the same memory without a lock.
        run: python3 tools/check_examples.py --tsan --jobs 4

  races:
    name: data races
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-recommends g++ cmake
          # The same newer compiler the sanitizer job uses, so that the
          # examples are checked here the way they are checked there.
          if apt-cache show g++-14 >/dev/null 2>&1; then
            sudo apt-get install -y --no-recommends g++-14
            echo "CXX=g++-14" >> "$GITHUB_ENV"
            echo "CC=gcc-14" >> "$GITHUB_ENV"
          fi

      - name: Run every test under the thread sanitizer
        # The thread sanitizer looks for a different kind of mistake: two
        # threads touching the same memory without a lock. It found a
        # released descriptor that was still being read, and a value that
        # was moved out of a node before the exchange that owned it.
        run: python3 tools/run_sanitizers.py --tsan --jobs 4 --skip tinyshell

  tinyshell:
    name: tinyshell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch the tinyshell submodule
        # The commit the parent repository pins is not on the submodule's
        # remote yet, so the fetch is allowed to fail. The job then reports
        # that tinyshell was not checked, rather than failing the run.
        continue-on-error: true
        run: git submodule update --init --recursive

      - name: Install the C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake

      - name: Configure, build and test
        run: |
          set -euo pipefail
          if [ ! -f tinyshell/CMakeLists.txt ]; then
            echo "::notice::the tinyshell submodule is not available, skipping"
            exit 0
          fi
          build=$(mktemp -d)
          cmake -S tinyshell -B "$build" -DBUILD_TESTING=ON
          cmake --build "$build" -j 2
          ctest --test-dir "$build" --output-on-failure
